plugins {
    id "net.fabricmc.fabric-loom" version "1.17.21"
}
version = project.mod_version
group = project.maven_group
base { archivesName = "AntiCrash" }
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}+mc${project.minecraft_version}"
}
repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}
processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
    from(rootProject.file("../assets/anticrash-icon.jpg")) {
        into "assets/anticrash"
        rename { "icon.jpg" }
    }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '512m'
}
def gameJar = providers.provider {
    sourceSets.main.compileClasspath.files.find {
        it.name.startsWith('minecraft-merged-deobf-') && it.name.endsWith('.jar')
    }
}
def offlineGame = layout.buildDirectory.file('test-fixtures/minecraft-access.jar')
tasks.register('prepareOfflineTestGame', JavaExec) {
    dependsOn tasks.named('compileTestJava')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.atsukimc.anticrash.audit.OfflineGameAccessTransformer'
    inputs.file(gameJar)
    outputs.file(offlineGame)
    maxHeapSize = '256m'
    doFirst { args = [gameJar.get().absolutePath, offlineGame.get().asFile.absolutePath] }
}
tasks.named('test', Test) {
    dependsOn tasks.named('prepareOfflineTestGame')
    classpath = files(offlineGame) + sourceSets.test.runtimeClasspath
}
java { withSourcesJar() }
jar { from("LICENSE") { rename { "LICENSE_AntiCrash" } } }
subprojects {
    group = rootProject.group
    version = rootProject.version
}
// A source migration is NOT recovery qualification. No automatic root build collection
// until target.json is promoted by the offline verification tool after all tests pass.

plugins {
    id "fabric-loom" version "1.14.10"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}+mc${project.minecraft_version}"
}

repositories {
    mavenCentral()
    maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API is deliberately not required. AntiCrash uses Loader + Mixin.
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
    from(rootProject.file("../anticrash-icon.jpg")) {
        into "assets/anticrash"
        rename { "icon.jpg" }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '512m'
}

// Offline JUnit needs the same package access fix as Knot development runtime. This fixture is
// local to build/, is not shipped or collected, and never invokes a Minecraft server entrypoint.
def mappedGameJar = providers.provider {
    sourceSets.main.compileClasspath.files.find { it.name.startsWith('minecraft-merged-') && it.name.endsWith('.jar') }
}
def testGameJar = layout.buildDirectory.file('test-fixtures/minecraft-access.jar')
tasks.register('prepareOfflineTestGame', JavaExec) {
    dependsOn tasks.named('compileTestJava')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.atsukimc.anticrash.audit.OfflineGameAccessTransformer'
    inputs.file(mappedGameJar)
    outputs.file(testGameJar)
    maxHeapSize = '256m'
    doFirst { args = [mappedGameJar.get().absolutePath, testGameJar.get().asFile.absolutePath] }
}
tasks.named('test', Test) {
    dependsOn tasks.named('prepareOfflineTestGame')
    classpath = files(testGameJar) + sourceSets.test.runtimeClasspath
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

tasks.named("sourcesJar", Jar) {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

subprojects {
    group = rootProject.group
    version = rootProject.version
}

// Runtime qualification probe: a separate test-only Fabric mod that records the simulation state
// every tick so a crash-and-recover run can be compared with an uninterrupted one. It is never
// part of AntiCrash-<version>.jar; packaging alone does not qualify runtime behavior.
// Opt-in legacy fixture sources; not part of the version's distribution or offline test contract.
if (providers.gradleProperty("enableRuntimeQualificationProbe").isPresent()) {
sourceSets {
    probe {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    probeCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.register("probeDevJar", Jar) {
    from sourceSets.probe.output
    archiveClassifier = "probe-dev"
    destinationDirectory = layout.buildDirectory.dir("devlibs")
}

// Loom 1.11 also wires source-set remap tasks into assemble.
    tasks.register("probeJar", net.fabricmc.loom.task.RemapJarTask) {
        dependsOn tasks.named("probeDevJar")
        inputFile = tasks.named("probeDevJar").flatMap { it.archiveFile }
        archiveClassifier = "probe"
        addNestedDependencies = false
    }
}

// Only tested, remapped distributable JARs are collected. Never copy dev/probe JARs.
tasks.register("collectBuilds", Copy) {
    dependsOn tasks.named("check"), tasks.named("remapJar"), project(":supervisor").tasks.named("build")
    from(tasks.named("remapJar").flatMap { it.archiveFile })
    from(project(":supervisor").tasks.named("jar").flatMap { it.archiveFile })
    into rootProject.file("../build")
}
tasks.named("build") {
    dependsOn tasks.named("collectBuilds")
}

// Compile shared implementation against this target's own Minecraft API.
apply from: "../gradle/sources.gradle"

plugins { id "fabric-loom" version "1.7.4" }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}+mc${project.minecraft_version}"
}
repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
}
sourceSets {
    main.java.srcDir("adapter-core/src/main/java")
    legacyIntegration {
        java {
            srcDirs = ["src/main/java", "adapter-core/src/main/java"]
            include "com/atsukimc/anticrash/legacy/**"
            include "com/atsukimc/anticrash/mixin/Legacy*"
        }
        compileClasspath += sourceSets.main.compileClasspath
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs.addAll(["-Xmaxerrs", "300"])
}
tasks.withType(Test).configureEach { useJUnitPlatform(); maxHeapSize = "512m" }
processResources {
    filesMatching("fabric.mod.json") { expand "version": project.version, "minecraft_version": project.minecraft_version }
    from(rootProject.file("../anticrash-icon.jpg")) { into "assets/anticrash"; rename { "icon.jpg" } }
}
subprojects { version = rootProject.version; group = rootProject.group }
// Migration sources are not a usable port. Never publish a partly connected recovery engine.
tasks.named("jar") { enabled = false }
tasks.named("remapJar") { enabled = false }
tasks.named("build") {
    doFirst { throw new GradleException("AntiCrash 1.16.1: PORT_IN_PROGRESS; full legacy adapter integration is incomplete.") }
}

// Compile shared implementation against this target's own Minecraft API.
apply from: "../gradle/sources.gradle"

// Expose the resolved, exact mapped game to the adapter-only offline CI job.
tasks.register("printLegacyGameJar") {
    doLast {
        def mapped = sourceSets.main.compileClasspath.files.find {
            it.name.startsWith("minecraft-merged-") && it.name.endsWith(".jar")
        }
        if (mapped == null) throw new GradleException("Mapped legacy Minecraft JAR is missing")
        println mapped.absolutePath
    }
}

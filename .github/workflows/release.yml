name: Verify and release

# One build matrix per PR/main push. Only matching release tags may publish a draft.
on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      publish:
        description: Create the draft release (the selected ref must be the release tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      mod: ${{ steps.version.outputs.mod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          PUBLISH: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.publish || false }}
        run: bash scripts/release_version.sh

  checks:
    needs: version
    uses: ./.github/workflows/checks.yml

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  release:
    needs: [version, checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MOD: ${{ needs.version.outputs.mod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: verification-*
          path: verification
          merge-multiple: true
      - name: Assemble release files
        run: bash scripts/assemble_release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.version.outputs.mod }}
          path: release/
      - name: Create draft release
        if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$MOD" --draft --verify-tag --title "Release $MOD" --notes-file notes.md release/*

name: Verify every version

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  layout:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        # Same target pattern as settings.gradle.kts. Two targets per job keeps every shard
        # inside one wave of the 20-job concurrency limit.
        run: |
          targets=$(grep -oE '^\["[0-9.]+"\]$' stonecutter.properties.toml | tr -d '[]"' \
            | paste -d ' ' - - | sed 's/ *$//' \
            | jq -R -c '{versions: ., id: gsub(" "; "-")}' | jq -s -c '{include: .}')
          echo "$targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: layout
    name: build ${{ matrix.versions }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.layout.outputs.targets) }}
    env:
      # Forked test JVMs see the same bounded CPU count as Gradle itself.
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      # Per-shard cache: Loom keeps one Minecraft copy per version outside Gradle's cleanup,
      # so a shared Gradle home grows to every target's game files.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.id }}-${{ hashFiles('stonecutter.properties.toml', '**/*.gradle.kts', 'gradle/minecraft.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ matrix.id }}-
      # One Gradle process per target bounds the retained Minecraft models. `build` compiles,
      # tests, builds the probe where supported and verifies both distribution JARs.
      - name: Build, test and verify
        env:
          VERSIONS: ${{ matrix.versions }}
        run: |
          for version in $VERSIONS; do
            ./gradlew --no-daemon --no-build-cache --max-workers=1 -PmcVersion="$version" ":$version:build"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ matrix.id }}
          path: |
            versions/*/build/reports/
            versions/*/build/test-results/test/*.xml
            supervisor/build/reports/
            supervisor/build/test-results/test/*.xml
            versions/*/build/libs/AntiCrash-*+mc*.jar
            !versions/*/build/libs/*-sources.jar
            supervisor/build/libs/AntiCrash-Supervisor-*+mc*.jar

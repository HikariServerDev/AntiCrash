name: Build version targets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover -s scripts -v
      - run: python3 scripts/check_sources.py

  build:
    needs: layout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.18'
          - '1.18.1'
          - '1.18.2'
          - '1.19'
          - '1.19.1'
          - '1.19.2'
          - '1.19.3'
          - '1.19.4'
          - '1.20'
          - '1.20.1'
          - '1.20.2'
          - '1.20.3'
          - '1.20.4'
          - '1.20.5'
          - '1.20.6'
          - '1.21'
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
          - '26.1'
          - '26.2'
          - '26.3'
    defaults:
      run:
        working-directory: versions/${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ startsWith(matrix.minecraft, '26.') && '25' || '21' }}
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew --no-daemon --console=plain check ${{ startsWith(matrix.minecraft, '26.') && 'jar' || 'remapJar' }} sourcesJar :supervisor:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/reports/

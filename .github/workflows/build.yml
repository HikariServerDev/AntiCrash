name: Verify every version

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
      - run: python3 scripts/format_java.py --check
      - run: python3 -m unittest discover -s scripts -v
      - run: python3 scripts/check_sources.py
      - id: matrix
        run: |
          python3 - <<'PY'
          import json, os
          matrix = json.load(open('versions.json'))
          targets = [{'minecraft': row['minecraft'], 'java': '25' if row['java_target'] >= 25 else '21', 'mod': matrix['mod_version']}
                     for row in matrix['versions'] if row['status'] == 'BUILD_VERIFIED']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + json.dumps({'include': targets}) + '\n')
          PY

  build:
    needs: layout
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.layout.outputs.targets) }}
    defaults:
      run:
        working-directory: ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1024m test build
      - run: python3 scripts/verify_artifacts.py --version ${{ matrix.minecraft }}
        working-directory: .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ matrix.minecraft }}
          path: |
            ${{ matrix.minecraft }}/build/reports/
            ${{ matrix.minecraft }}/supervisor/build/reports/
            ${{ matrix.minecraft }}/build/libs/AntiCrash-${{ matrix.mod }}+mc${{ matrix.minecraft }}.jar
            ${{ matrix.minecraft }}/supervisor/build/libs/AntiCrash-Supervisor-${{ matrix.mod }}+mc${{ matrix.minecraft }}.jar

  legacy-adapter:
    needs: layout
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: '1.16.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - run: |
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1024m compileLegacyIntegrationJava
          mapped=$(./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1024m -q printLegacyGameJar | tail -n 1)
          test -f "$mapped"
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1024m :adapter-core:test -PlegacyGameJar="$mapped"

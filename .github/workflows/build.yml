name: Build version targets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover -s scripts -v
      - run: python3 scripts/check_sources.py

  build:
    needs: layout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.18'
          - '1.18.1'
          - '1.18.2'
          - '1.19'
          - '1.19.1'
          - '1.19.2'
          - '1.19.3'
          - '1.19.4'
          - '1.20'
          - '1.20.1'
          - '1.20.2'
          - '1.20.3'
          - '1.20.4'
          - '1.20.5'
          - '1.20.6'
          - '1.21'
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
          - '26.1'
          - '26.2'
          - '26.3'
    defaults:
      run:
        working-directory: versions/${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ startsWith(matrix.minecraft, '26.') && '25' || '21' }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - run: sh ./gradlew --no-daemon --console=plain check ${{ startsWith(matrix.minecraft, '26.') && 'jar' || 'remapJar' }} sourcesJar :supervisor:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/reports/

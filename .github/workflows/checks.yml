name: Quality check

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      # Reuse the same bounded Gradle cache as build shards, including the pinned wrapper.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-quality-${{ hashFiles('settings.gradle.kts', 'stonecutter.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-quality-
            gradle-
      # Same entry point as local development (formatCheck, sourceCheck, scriptTest), configured
      # for the VCS target only, which is the last entry of the matrix.
      - name: Format, source ownership and script tests
        run: |
          vcs=$(grep -oE '^\["[0-9.]+"\]$' stonecutter.properties.toml | tail -1 | tr -d '[]"')
          ./gradlew --no-daemon --max-workers=1 -PmcVersion="$vcs" qualityCheck

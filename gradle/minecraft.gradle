// One build definition for every node. Pins and API flags live in the TOML matrix.
def target = project.ext.anticrashTarget
def mc = target.minecraft
def obfuscated = target.obfuscated
base { archivesName = 'AntiCrash' }
tasks.withType(AbstractArchiveTask).configureEach { archiveVersion = "${project.version}+mc${mc}" }
repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (obfuscated) mappings loom.officialMojangMappings()
    add(obfuscated ? 'modImplementation' : 'implementation', "net.fabricmc:fabric-loader:${target.loader}")
    if (target.compileApi.toBoolean()) compileOnly "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
if (obfuscated) {
    loom { mixin {
        useLegacyMixinAp = target.legacyMixinAp.toBoolean()
        if (target.legacyMixinAp.toBoolean()) defaultRefmapName = target.refmap
    } }
}
java {
    withSourcesJar()
    toolchain { languageVersion = JavaLanguageVersion.of(target.compiler.toInteger()) }
}
tasks.withType(JavaCompile).configureEach { options.release = target.java.toInteger(); options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '512m'
    doFirst {
        systemProperty 'anticrash.mixinSources', sourceSets.main.java.matching {
            include 'com/atsukimc/anticrash/mixin/*.java'
        }.files*.absolutePath.sort().join(File.pathSeparator)
    }
}
// The ordered Mixin catalogue is runtime data, not alternate Java source trees.
tasks.named('processResources') {
    inputs.properties([version: project.version, minecraft_version: mc, loader_version: target.loader, java_release: target.java])
    filesMatching('fabric.mod.json') {
        expand(version: project.version, minecraft_version: mc, loader_version: target.loader, java_release: target.java)
    }
    from(rootProject.file("gradle/mixins/${target.mixinProfile}.json")) { rename { 'anticrash.mixins.json' } }
}
if (!target.offlineAccess.toBoolean()) {
    sourceSets.test.resources.exclude('junit-platform.properties', 'META-INF/services/org.junit.jupiter.api.extension.Extension')
}
tasks.named('processTestResources') {
    from(rootProject.file("qualification/fixtures/${target.entityAudit}")) { into 'runtime-audit'; rename { 'entities.tsv' } }
    from(rootProject.file("qualification/fixtures/${target.blockEntityAudit}")) { into 'runtime-audit'; rename { 'block-entities.tsv' } }
}
if (target.offlineAccess.toBoolean()) {
    def gameJar = providers.provider {
        sourceSets.main.compileClasspath.files.find {
            it.name.startsWith(obfuscated ? 'minecraft-merged-' : 'minecraft-merged-deobf-') && it.name.endsWith('.jar')
        }
    }
    def fixture = layout.buildDirectory.file('test-fixtures/minecraft-access.jar')
    tasks.register('prepareOfflineTestGame', JavaExec) {
        dependsOn tasks.named('compileTestJava')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'com.atsukimc.anticrash.audit.OfflineGameAccessTransformer'
        inputs.file(gameJar)
        outputs.file(fixture)
        maxHeapSize = '256m'
        doFirst { args = [gameJar.get().absolutePath, fixture.get().asFile.absolutePath] }
    }
    tasks.named('test', Test) {
        dependsOn tasks.named('prepareOfflineTestGame')
        classpath = files(fixture) + sourceSets.test.runtimeClasspath
    }
}
tasks.named('jar', Jar) { from(rootProject.file('LICENSE')) { rename { 'LICENSE_AntiCrash' } } }
tasks.named('sourcesJar', Jar) { from(rootProject.file('LICENSE')) { rename { 'LICENSE_AntiCrash' } } }
// Every node declares the source set so active-version switching also processes probes.
sourceSets {
    qualification {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
if (target.qualification.toBoolean()) {
    if (target.fabricApi) dependencies { qualificationCompileOnly "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}" }
    tasks.register('probeDevJar', Jar) {
        from sourceSets.qualification.output
        archiveClassifier = 'probe-dev'
        destinationDirectory = layout.buildDirectory.dir('qualification')
    }
    def remapTask = project.plugins.getPlugin('fabric-loom').class.classLoader.loadClass('net.fabricmc.loom.task.RemapJarTask')
    tasks.register('probeJar', remapTask) {
        dependsOn tasks.named('probeDevJar')
        inputFile = tasks.named('probeDevJar').flatMap { it.archiveFile }
        archiveClassifier = 'probe'
        addNestedDependencies = false
        destinationDirectory = layout.buildDirectory.dir('qualification')
    }
    tasks.named('build') { dependsOn tasks.named('probeJar') }
}
// Supervisor has no Minecraft dependency; compile and test the component once.
evaluationDependsOn(':supervisor')
def supervisorJar = project(':supervisor').tasks.named('jarFor' + mc.replace('.', '_'))
tasks.register('collectArtifacts', Copy) {
    dependsOn tasks.named('check'), tasks.named(obfuscated ? 'remapJar' : 'jar'), supervisorJar, ':supervisor:test'
    from(tasks.named(obfuscated ? 'remapJar' : 'jar').flatMap { it.archiveFile })
    from(supervisorJar.flatMap { it.archiveFile })
    into rootProject.file("dist/refactor/${project.version}")
}
// Distribution checks for both JARs of this target. scripts/verify_artifacts.py keeps only the
// optional comparison against a previous release.
def modJar = tasks.named(obfuscated ? 'remapJar' : 'jar').flatMap { it.archiveFile }
tasks.register('verifyDistribution') {
    group = 'verification'
    dependsOn tasks.named('collectArtifacts')
    inputs.file(modJar)
    inputs.file(supervisorJar.flatMap { it.archiveFile })
    doLast {
        def require = { boolean ok, String message -> if (!ok) throw new GradleException(message) }
        def license = rootProject.file('LICENSE').bytes
        def jars = [(modJar.get().asFile): false, (supervisorJar.get().archiveFile.get().asFile): true]
        jars.each { File jar, boolean supervisor ->
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                def entries = zip.entries().toList()
                def names = entries*.name
                require(names.size() == names.toSet().size(), "Duplicate entries: ${jar.name}")
                // ZipFile streams do not check CRCs, so compute and compare each entry explicitly.
                byte[] buffer = new byte[8192]
                entries.each { entry ->
                    def crc = new java.util.zip.CRC32()
                    long size = 0
                    zip.getInputStream(entry).withCloseable { input ->
                        int count
                        while ((count = input.read(buffer)) != -1) {
                            crc.update(buffer, 0, count)
                            size += count
                        }
                    }
                    require(size == entry.size && crc.value == entry.crc, "ZIP CRC/size mismatch: ${jar.name}/${entry.name}")
                }
                def bytes = { String name ->
                    require(zip.getEntry(name) != null, "Missing ${name}: ${jar.name}")
                    zip.getInputStream(zip.getEntry(name)).withCloseable { it.readAllBytes() }
                }
                def text = { String name -> new String(bytes(name), 'UTF-8') }
                require(names.every { !it.contains('org/junit/') && !it.contains('OfflineGameAccessTransformer') && !it.startsWith('com/atsukimc/anticrash/probe/') },
                        "Test or probe classes packaged: ${jar.name}")
                require(Arrays.equals(bytes(supervisor ? 'LICENSE_AntiCrash-Supervisor' : 'LICENSE_AntiCrash'), license), "License changed: ${jar.name}")
                if (supervisor) {
                    require(text('META-INF/MANIFEST.MF').contains('Main-Class: com.atsukimc.anticrash.supervisor.SupervisorMain'), "Supervisor Main-Class missing: ${jar.name}")
                } else {
                    def metadata = new groovy.json.JsonSlurper().parseText(text('fabric.mod.json'))
                    require(metadata.id == 'anticrash' && metadata.version == project.version.toString(), "fabric.mod.json id/version: ${jar.name}")
                    require(metadata.environment == 'server' && metadata.license == 'LGPL-3.0-only', "fabric.mod.json environment/license: ${jar.name}")
                    require(metadata.depends.minecraft == "=${mc}".toString(), "fabric.mod.json Minecraft dependency: ${jar.name}")
                    require(Arrays.equals(bytes(metadata.icon), rootProject.file("src/main/resources/${metadata.icon}").bytes), "Icon changed: ${jar.name}")
                    def mixins = new groovy.json.JsonSlurper().parseText(text('anticrash.mixins.json'))
                    require(mixins.mixins.contains('UserCacheMixin'), "UserCacheMixin not registered: ${jar.name}")
                }
            }
        }
    }
}
tasks.named('build') { dependsOn tasks.named('collectArtifacts'), tasks.named('verifyDistribution') }

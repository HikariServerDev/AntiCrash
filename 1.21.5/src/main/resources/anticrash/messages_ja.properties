recovery.login_blocked=AntiCrash復旧またはcheckpoint処理中のためログインできません。
login.hold_started=checkpoint/recovery処理中のため、接続を最大{0}秒保留して再試行します（他の理由によるkickは通常どおりです）
config.action_bar_delay_range=notifications.checkpoint_action_bar_delay_ticks は 0..1200 の範囲で指定してください。10 を使用します。
config.login_retry_range=login.retry_timeout_seconds は 0..20 の範囲で指定してください。5 を使用します。

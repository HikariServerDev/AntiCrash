recovery.entity_load_pump_failed=凍結中のEntity読み込みを進められませんでした（{0}）: {1}
crashraw.deduplicated=crash-rawの保存で、変わっていない {0} 個のファイルを以前のcopy {1} と共有しました（二重に保存しません）
crashraw.compacted=古いcrash-raw間で同一のファイル {0} 個を共有にしました（{1} MB解放）
crashraw.compaction_failed=crash-rawの同一ファイルの共有に失敗しました: {0}
chunk.low_memory_mode=復旧中にヒープの空きが少なくなりました（Chunk {0}/{1} 準備済み、最大ヒープ {2} MB）。残りのChunkは1件ずつ準備し、メモリの回収を待ちながら進めます。復元するChunkの範囲は変わりません
chunk.heap_exhausted=ガベージ回収後もヒープの空きが戻らず、読み込み中のChunkもありません（Chunk {0}/{1} 準備済み、回収後も約 {2} MB 使用中 / 最大 {3} MB）。このcheckpointのChunkはこのヒープに収まりません。-Xmx を増やしてください
runtime.order_restored=最初のtickの前にcheckpoint時のtick順序を復元しました: BlockEntity ticker {0}件（新規 {1}、消滅 {2}）、Entity {3}件（新規 {4}、消滅 {5}）、期限つきticket {6}件
runtime.order_restore_skipped={0} を復元できませんでした。Minecraftが作った順序のまま再開します: {1}
recovery.degraded=復旧が {0} で不完全（DEGRADED）です: {1}。Worldは再開しますが、この部分はcheckpoint時点と完全には一致しません
command.status.degraded=直近の復旧はDEGRADED: {0}
runtime.piston_verified=最初のtickの前に動作中ピストンの進行度を照合しました: MATCH {0}/{1}（古いcheckpointで未記録: {2}）
chunk.recovery_tickets_released_at_start=checkpoint時の恒久ticketがすべて再現されたため、復旧用ticketを最初のtickの前に解除しました
chunk.recovery_tickets_kept=checkpoint時のticketの一部（例: 接続していないPlayerのもの）が存在しないため、復旧用ticketを{0} tick保持します
runtime.categories_verified=最初のtickの前にRuntime stateを照合しました: {0}

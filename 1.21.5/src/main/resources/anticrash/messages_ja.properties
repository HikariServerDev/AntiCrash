command.help.header=----- AntiCrash コマンド -----
command.help.start=/ac start - 復旧後のゲーム内時間を安全なtick境界で再開
command.help.status=/ac status - 復旧・checkpoint・検証状態を表示
command.help.freeze=/ac freeze - ゲーム内時間を復旧凍結へ移行
command.help.checkpoint=/ac checkpoint [now|base|compact|list|info <id>|restore <id>] - checkpointの作成・確認
command.help.recovery=/ac recovery [status|verify [--verbose]|restore <id>|start|abort|continue|y|n] - 復旧判断と等価性検証
command.help.fakeplayers=/ac fakeplayers [restore|info <name>] - Carpet FakePlayer状態
command.help.journal=/ac journal [status|list] - 外部整合性journal状態
command.help.config=/ac config reload - 設定を安全に再読込し、コマンド候補を更新
command.help.debug=/ac debug [dump|equivalence [--verbose]|checkpoint-performance [verbose|last|reset]|mirror [audit]] - 診断情報を出力
command.status=AntiCrash 1.0.0\n状態: {0}（World凍結={3}、開始検証={4}、ASK残り={20}）\nCheckpoint: 選択={1}、現在の時間線={2}、次回まで={19}\nSnapshot: backend={5}、整合性={6}\nChunk: READY {7}/{8}、失敗={9}\nBlock Event: 復元={10}、失敗={11}\nFakePlayer: READY {12}/{13}、失敗={14}\nReal Player: {15}\n外部整合性mode: {16}\nWorld: {17}\nError: {18}
command.checkpoint.requested=[AntiCrash] checkpointを要求しました。次の安全なtick境界で実行します。
command.checkpoint.base_requested=[AntiCrash] 完全なBASE checkpointを明示的に要求しました。大規模Worldでは作成中の停止時間が長くなる可能性があります。
command.checkpoint.compaction_requested=[AntiCrash] 検証済みcheckpointのオフラインcompactを開始しました。Live WorldとGame Tickは停止しません。
command.checkpoint.compaction_rejected=[AntiCrash] compactを開始できません（checkpoint処理中、親checkpoint未準備、または利用不可）。
command.checkpoint.rejected=[AntiCrash] checkpoint要求を拒否しました（無効または利用不可）。
command.freeze=[AntiCrash] 復旧凍結を要求しました。現在の状態={0}
command.freeze.rejected=[AntiCrash] 現在の状態では復旧凍結へ移行できません。現在の状態={0}
command.restore.scheduled=[AntiCrash] {0} の復元を予約しました。World読み込み前の復元処理のため安全に再起動します。
command.restore.rejected=[AntiCrash] checkpointが存在しないか無効です: {0}
command.start.scheduled=[AntiCrash] 再開を予約しました。次の安全なtick境界でゲーム内の時間を再開し、完了時にお知らせします。
command.start.rejected=[AntiCrash] 開始できません: {0}
command.abort.scheduled=[AntiCrash] crash-raw復元を予約しました。World読み込み前の復元処理のため安全に再起動します。
command.abort.rejected=[AntiCrash] Recovery中ではないか、利用可能なcrash-raw Worldがありません。
command.continue.success=[AntiCrash] checkpointを復元せずに続行します。
command.continue.rejected=[AntiCrash] Serverは復旧判断を待っていません。
command.recovery.answer_restore=[AntiCrash] Yを受け付けました。checkpoint {0} の復元を予約し、安全に再起動します。
command.recovery.answer_continue=[AntiCrash] Nを受け付けました。checkpointを復元せず続行します。
command.recovery.answer_rejected=[AntiCrash] 現在Y/Nの回答を待っていません。
